name: Bug report
description: Report a bug in toolwall
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Please confirm this is **not** a security vulnerability. If it is,
        do not open a public issue — see `SECURITY.md` and report privately
        via the GitHub security advisory link or `security@bryteai.studio`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What you expected
      description: What you thought would happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Smallest code snippet that reproduces the issue.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: toolwall version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Python
        - TypeScript
        - Both
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.4"

  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "22.5.1"

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 14.5 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, related issues, anything else useful.
