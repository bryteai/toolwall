name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is supported by the core library (pydantic + regex only) but
        # the adapters extras pull in transitive deps (onnxruntime via
        # crewai / mcp) that dropped cp310 wheels at 1.24+. The CI matrix
        # below tests the full --all-extras stack, so it pins to 3.11+.
        # Library users on 3.10 with core deps only are unaffected;
        # requires-python in pyproject.toml stays >=3.10.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        # The judge extra (torch + transformers) is not installed in CI; tests run rules only.
        run: uv sync --extra adapters --dev
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/toolwall
      - name: Test
        run: uv run pytest -ra --cov=toolwall --cov-report=xml

  test-py310-core:
    # Honours requires-python>=3.10 by testing the core library (no extras)
    # on 3.10. Uses plain pip so the uv.lock (which has cp310-incompatible
    # adapters transitives like onnxruntime>=1.24) is bypassed. Adapter
    # integration tests are excluded here for the same reason — they would
    # require cp310 wheels that no longer exist upstream.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install core + dev only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test core (detect + decorator + policy)
        run: pytest -ra tests/test_detect.py tests/test_decorator.py tests/test_policy.py

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
